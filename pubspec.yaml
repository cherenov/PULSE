name: pulse
description: "Personal Unit for Health and Life Evaluation"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.5
  flutter_riverpod: ^3.4.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  fl_chart: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.9
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.8

flutter:

  uses-material-design: true
  assets:
    - assets/app-logo.jpg
    - assets/brand/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app-logo.jpg"
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/app-logo.jpg"
  web:
    generate: true
    image_path: "assets/app-logo.jpg"
    background_color: "#000000"
    theme_color: "#000000"

flutter_native_splash:
  color: "#000000"
  image: "assets/brand/splash_android12.png"
  android: true
  ios: true
  web: false
  android_12:
    # Android 12+ masks the icon to a circle; this asset is padded to fit.
    image: "assets/brand/splash_android12.png"
    color: "#000000"
    icon_background_color: "#000000"
